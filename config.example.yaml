llama_cpp:
  bench_bin: ~/llama.cpp/build/bin/llama-bench
  server_bin: ~/llama.cpp/build/bin/llama-server
  server_port: 8090

vllm:
  api_base: http://127.0.0.1:8000/v1

dashboard:
  port: 8085
  gpu_poll_interval: 2

speed:
  context_lengths: [128, 512, 2048, 4096, 8192, 16384]
  generation_length: 128
  n_gpu_layers: 99

quality:
  tasks:
    - mmlu
    - arc_challenge
    - hellaswag
    - humaneval
    - gsm8k

models_dir: ~/.cache/huggingface/hub
results_dir: ./results

hardware:
  gpu: "YOUR GPU HERE"
  vram: "32GB"
  cpu: "YOUR CPU HERE"
  ram: "64GB DDR5"
  os: "Ubuntu 24.04 LTS"
  cuda: "12.8"

agentic:
  system_prompt: ./data/agentic/hermes_system_prompt.txt
  data_dir: ./data/agentic
  base_ctx: 16384          # shared server (codeact/instruction/multistep); longcontext starts its own server per depth (depth + gen + margin), so a depth that OOMs scores 0 there instead of failing the whole model
  evals:
    codeact:     {limit: 100, think: true,  max_tokens: 1536, exec_timeout: 10}
    instruction: {limit: 50,  think: false, max_tokens: 512}
    longcontext: {limit: 15,  think: false, max_tokens: 512, depths: [16384, 32768, 65536]}
    multistep:   {limit: 12,  think: true,  max_tokens: 768, max_steps: 8}
  weights:
    codeact: 0.40
    longcontext: 0.25
    instruction: 0.20
    multistep: 0.15
  models:
    - {slug: hermes-4_3-36b,         path: ~/.cache/huggingface/hub/<hermes-4.3-36b.gguf>}
    - {slug: hermes-4-14b,           path: ~/.cache/huggingface/hub/<hermes-4-14b.gguf>}
    - {slug: nemotron-cascade-2-30b, path: ~/.cache/huggingface/hub/<nemotron.gguf>}
    - {slug: qwen3-6-35b-a3b,        path: ~/.cache/huggingface/hub/<qwen35b.gguf>}
    - {slug: gemma-4-31b,            path: ~/.cache/huggingface/hub/<gemma4-31b.gguf>}

# 5090 Treatment #1 — per-model MoE offload overrides (absent slug -> full VRAM, -ngl 99).
# The gpt-oss-120b slug + tuned n_cpu_moe are filled in at runtime after load-testing (plan Task 8).
offload: {}
