[pytest]
# One place for how the suite is run. CI (.github/workflows/tests.yml) and a
# local `pytest -q` both read this file, so the two cannot drift.
testpaths = tests
markers =
    needs_torch: needs torch and a gpu-side install; run on the gpu box, deselected in ci
    needs_cadence: needs the private cadence package that is not part of this repo
    needs_sandbox: spawns the code-action sandbox subprocess (slow, needs the venv interpreter)
# test_echo_maze_torch imports torch at module level; test_threshold imports the
# private `cadence` package. Neither is installable from requirements-dev.txt, so
# both are skipped at collection time here rather than failing on import.
addopts = --ignore=tests/test_echo_maze_torch.py --ignore=tests/test_threshold.py
